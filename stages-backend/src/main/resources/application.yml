server:
  port: 8082

spring:
  application:
    name: stages-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/stages_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@gmail.com}
    password: ${MAIL_PASSWORD:secret}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  thymeleaf:
    check-template-location: false

  web:
    resources:
      static-locations: file:uploads/,classpath:/static/

jwt:
  secret: ${JWT_SECRET:NkZDQzU2QzgxMkU0RjY3MDlCMkM0RDhBMUU2RjU3QTZDNTZGNUM=}
  expiration: 86400000

storage:
  local:
    path: uploads
    url: http://localhost:8082/files

minio:
  url: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: stages-documents

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    com.gestion: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
